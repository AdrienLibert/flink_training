# 02-secrets.yaml — credentials projected as env vars.
#
# In production these come from a secrets operator (External Secrets,
# Vault Agent, etc.). This manifest is a placeholder showing the shape.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  namespace: streaming
type: Opaque
stringData:
  PG_USERNAME: flink
  PG_PASSWORD: REPLACE_VIA_SECRET_OPERATOR
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: streaming
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE
  AWS_SECRET_ACCESS_KEY: REPLACE
